<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anunciar Equipamento</title>
</head>
<body>
  <h1>Anunciar Equipamento</h1>
  <form>
    <fieldset>
      <legend>Informações Gerais</legend>
      <p>
        <label for="titulo">Título do Anúncio</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex.: Corda dinâmica Petzl 9,8 mm 60 m" required>
      </p>
      <p>
        <label for="marca">Marca</label>
        <input type="text" id="marca" name="marca" list="marcas" required>
        <datalist id="marcas">
          <option value="Petzl">
          <option value="Black Diamond">
          <option value="Mammut">
        </datalist>
      </p>
      <p>
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" name="modelo" required>
      </p>
      <p>
        <label for="preco">Preço</label>
        <input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="0,00" required>
      </p>
      <p>
        <label for="estado-corda">Estado de conservação</label>
        <select id="estado-corda" name="estado_conservacao" required>
          <option value="" disabled selected>Selecione</option>
          <option value="novo">Nova, sem uso</option>
          <option value="seminovo">Seminova</option>
          <option value="usado">Usada, desgaste normal</option>
          <option value="desgastado">Muito usada</option>
        </select>
        <br>
        <small>Nova: nunca usada. Seminova: poucos usos, sem desgaste visível. Usada: capa com felpas, mas íntegra. Muito usada: desgaste visível em trechos da corda.</small>
      </p>
    </fieldset>
  </form>
  <a href="../index.html">Página Inicial</a>
</body>
</html>
